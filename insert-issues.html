<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Insert Jira Issues</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .badge-status { font-size: 0.75rem; padding: 0.3em 0.6em; }
    .table thead th { vertical-align: middle; }
    .icon-cell { font-size: 1.25rem; }
  </style>
</head>
<body class="bg-light">

<div class="container my-5 p-4 bg-white rounded shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Insert Jira issues from <strong>pi-dev-sandbox</strong></h5>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm">ISSUE VIEW</button>
      <button class="btn btn-outline-secondary btn-sm">COUNT VIEW</button>
    </div>
  </div>

  <div class="mb-3">
    <input type="text" class="form-control font-monospace" value='project="DI" order by created desc'>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Assignee</th>
          <th>Issue Type</th>
          <th>Key</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Summary</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><img src="https://via.placeholder.com/24" class="rounded-circle me-2" alt=""> David Michelson</td>
          <td class="icon-cell text-danger"><i class="bi bi-square-fill"></i></td>
          <td><a href="#">DI-10</a></td>
          <td class="text-warning">=</td>
          <td><span class="badge bg-secondary badge-status">TO DO</span></td>
          <td>Users' profile pictures are not rendering correctly</td>
          <td>Sep 21, 2020, 13:05</td>
        </tr>
        <tr>
          <td><i class="bi bi-person-circle me-2"></i> Unassigned</td>
          <td class="icon-cell text-info"><i class="bi bi-check-square-fill"></i></td>
          <td><a href="#">DI-9</a></td>
          <td class="text-warning">=</td>
          <td><span class="badge bg-success badge-status">DONE</span></td>
          <td>Add ability to add attachments</td>
          <td>Feb 3, 2021, 18:29</td>
        </tr>
        <!-- Add more rows as needed -->
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <small class="text-muted">32 issues</small>
    <div class="d-flex gap-2">
      <button class="btn btn-light">Cancel</button>
      <button class="btn btn-primary">Insert issues</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
